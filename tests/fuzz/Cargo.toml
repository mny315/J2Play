[package]
name = "parser-fuzz"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Dependency-free stdin fuzz harness for J2Play parsers"
publish = false

[[bin]]
name = "parser-fuzz"
path = "src/main.rs"

[dependencies]
bytecode = { path = "../../crates/bytecode" }
classfile = { path = "../../crates/classfile" }
diagnostics = { path = "../../crates/diagnostics" }
gcf = { path = "../../crates/gcf" }
graphics = { path = "../../crates/graphics" }
jar = { path = "../../crates/jar" }
m3g = { path = "../../crates/m3g" }
micro3d = { path = "../../crates/micro3d" }
mmapi = { path = "../../crates/mmapi" }
natives = { path = "../../crates/natives" }

[lints]
workspace = true
