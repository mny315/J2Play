[package]
name = "j2play-conformance"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
autotests = false
description = "Project-owned Java ME conformance tests (not shipped)"

[[test]]
name = "conformance"
path = "main.rs"

[dev-dependencies]
bluetooth = { path = "../../crates/bluetooth" }
bytecode = { path = "../../crates/bytecode" }
classfile = { path = "../../crates/classfile" }
cldc = { path = "../../crates/cldc" }
device-profile = { path = "../../crates/device-profile" }
diagnostics = { path = "../../crates/diagnostics" }
frontend-core = { path = "../../crates/frontend-core" }
gcf = { path = "../../crates/gcf" }
graphics = { path = "../../crates/graphics" }
jar = { path = "../../crates/jar" }
launch = { path = "../../crates/launch" }
midp = { path = "../../crates/midp" }
mmapi = { path = "../../crates/mmapi" }
natives = { path = "../../crates/natives" }
rms = { path = "../../crates/rms" }
runtime = { path = "../../crates/runtime" }
runtime-bootstrap = { path = "../../crates/runtime-bootstrap" }
vm = { path = "../../crates/vm" }
platform = { path = "../../crates/platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }

[lints]
workspace = true
