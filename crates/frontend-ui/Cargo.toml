[package]
name = "frontend-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.95"
description = "Shared egui/eframe product UI for J2Play frontends"

[features]
default = ["aot"]
aot = ["frontend-core/aot"]

[dependencies]
diagnostics = { path = "../diagnostics" }
device-profile = { path = "../device-profile" }
eframe = { version = "=0.36.1", default-features = false, features = ["default_fonts", "wgpu"] }
frontend-core = { path = "../frontend-core", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png"] }
launch = { path = "../launch" }
platform = { path = "../platform" }
serde_json = "1.0"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "=0.36.1", default-features = false, features = ["android-native-activity"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "=0.36.1", default-features = false, features = ["wayland", "x11"] }

[lints]
workspace = true
